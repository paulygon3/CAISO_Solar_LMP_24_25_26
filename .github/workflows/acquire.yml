name: Acquire official CAISO market inputs
on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Optional single month (YYYY-MM)'
        required: false
  push:
    paths: ['.github/workflows/acquire.yml']
concurrency:
  group: caiso-oasis-acquisition
  cancel-in-progress: false
permissions:
  contents: write
  actions: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MONTH: ${{ inputs.month }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt
      - name: Restore the verified pilot inputs
        run: |
          gh release download checkpoint-v1 -p CAISO_resume.zip -D "$RUNNER_TEMP"
          echo "ecfae841bbc61a54779c2eb6988d3459b0429e2035b06477d330181ae120e92d  $RUNNER_TEMP/CAISO_resume.zip" | sha256sum -c
          python - "$RUNNER_TEMP/CAISO_resume.zip" <<'PY'
          import sys,zipfile,pathlib,shutil
          with zipfile.ZipFile(sys.argv[1]) as z:
              for n in z.namelist():
                  p=pathlib.Path(n)
                  if p.parts[:1]==('caiso',) and len(p.parts)==3 and p.parts[1] in ('cache','manifests','canonical'):
                      dst=pathlib.Path(*p.parts[1:])
                      dst.parent.mkdir(exist_ok=True)
                      with z.open(n) as s,dst.open('wb') as f:shutil.copyfileobj(s,f)
          PY
      - name: Reuse verified progress from an interrupted month when available
        run: |
          gh run list --workflow acquire.yml --status failure --limit 8 --json databaseId --jq '.[].databaseId' > "$RUNNER_TEMP/interrupted-runs"
          while read -r id; do
            tag="unfinished-oasis-inputs-$id"
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" --jq '.artifacts[]|select(.expired==false)|.name' | grep -Fxq "$tag"; then
              gh run download "$id" -n "$tag" -D "$RUNNER_TEMP/unfinished"
              python - <<'PY'
          import os,pathlib,shutil
          src=pathlib.Path(os.environ["RUNNER_TEMP"])/"unfinished"
          for folder in ("cache","canonical","manifests","quarantine"):
              root=src/folder
              if not root.is_dir():continue
              for path in root.iterdir():
                  if path.is_file() and path.suffix in {".parquet",".zip",".json"}:
                      dest=pathlib.Path(folder)/path.name
                      dest.parent.mkdir(exist_ok=True)
                      shutil.copyfile(path,dest)
          PY
              break
            fi
          done
      - name: Acquire and publish monthly source and canonical archives
        run: |
          set -eu
          gh release view market-inputs-v1 >/dev/null 2>&1 || gh release create market-inputs-v1 --title 'CAISO source archives and canonical data' --notes 'Each month includes the original OASIS daily ZIPs, validated hourly canonical prices, effective reference snapshots, and SHA-256 manifests. Monthly manifest publication marks completion of that month.'
          args=()
          if [ -n "$MONTH" ]; then args+=(--month "$MONTH"); fi
          python -u src/acquire.py "${args[@]}" --release market-inputs-v1 --cleanup
      - name: Save verified days from an interrupted month
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unfinished-oasis-inputs-${{ github.run_id }}
          compression-level: 0
          retention-days: 7
          path: |
            cache/
            canonical/
            manifests/*.json
            quarantine/
      - name: Preserve retrieval diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acquisition-diagnostics-${{ github.run_id }}
          path: |
            manifests/events.jsonl
            staging/packages/*-manifest.json
          retention-days: 7
